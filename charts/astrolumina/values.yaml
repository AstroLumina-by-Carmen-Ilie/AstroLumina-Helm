        key: ASTROLOGER_API_URL
      - name: ASTROLOGER_API_HOST
        key: ASTROLOGER_API_HOST
      - name: ASTROLOGER_API_KEY
        key: ASTROLOGER_API_KEY
      - name: ASTROLOGY_API_SENTRY_DSN
        key: ASTROLOGY_API_SENTRY_DSN
    # Exact DopplerSecret sync list for this service (order matches the
    # original 03-doppler-secrets.yaml).
    dopplerSync:
      - NODE_ENV
      - FRONTEND_SERVER_PORT
      - FRONTEND_SERVER_DNS
      - ASTROLOGY_API_SERVER_PORT
      - ASTROLOGY_API_SERVER_DNS
      - BOOKING_API_SERVER_PORT
      - BOOKING_API_SERVER_DNS
      - PAYMENT_API_SERVER_PORT
      - PAYMENT_API_SERVER_DNS
      - FRONTEND_SERVER_K8S_PORT
      - ASTROLOGY_API_SERVER_K8S_PORT
      - BOOKING_API_SERVER_K8S_PORT
      - PAYMENT_API_SERVER_K8S_PORT
      - CORS_ORIGINS
      - ASTROLOGER_API_URL
      - ASTROLOGER_API_HOST
      - ASTROLOGER_API_KEY
      - ASTROLOGY_API_SENTRY_DSN
    dopplerExtraKeys: []
  - name: booking-api
    component: booking-api
