# Shared defaults for the astrolumina chart. Environment-specific settings
# (namespace, replicas, probes, Traefik, placeholder secret values, Doppler
# project config) live in values-dev/staging/production.yaml. This file holds
# what is IDENTICAL across environments: the service catalog, container
# images, resource budgets and the full secretKeyRef env wiring per service
# (Compose-style variable names — the frontend entrypoint injects them into
# public/env.js, VITE_* names are NOT read by the image).
image:
  registry: ghcr.io/astrolumina-by-carmen-ilie
  tag: latest
  pullPolicy: Always
  pullSecret: ghcr-secret

# Ordered service catalog. `env` is the exact secretKeyRef wiring from the
# Kustomize deployments (name -> key, plus `optional: true` where the
# originals set it). The DopplerSecret sync list for each service is derived
# from these keys, so deployments and sync lists can never drift apart.
services:
  - name: frontend
    component: frontend
    image: astrolumina-frontend
    containerPort: 80
    servicePort: 80
    nodePort: 30080
    probePath: /
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
    env:
      - name: NODE_ENV
        key: NODE_ENV
      - name: FRONTEND_SERVER_PORT
        key: FRONTEND_SERVER_PORT
      - name: FRONTEND_SERVER_DNS
        key: FRONTEND_SERVER_DNS
      - name: ASTROLOGY_API_SERVER_PORT
        key: ASTROLOGY_API_SERVER_PORT
      - name: ASTROLOGY_API_SERVER_DNS
        key: ASTROLOGY_API_SERVER_DNS
      - name: BOOKING_API_SERVER_PORT
        key: BOOKING_API_SERVER_PORT
      - name: BOOKING_API_SERVER_DNS
        key: BOOKING_API_SERVER_DNS
      - name: PAYMENT_API_SERVER_PORT
        key: PAYMENT_API_SERVER_PORT
      - name: PAYMENT_API_SERVER_DNS
        key: PAYMENT_API_SERVER_DNS
      - name: FRONTEND_SERVER_K8S_PORT
        key: FRONTEND_SERVER_K8S_PORT
      - name: ASTROLOGY_API_SERVER_K8S_PORT
        key: ASTROLOGY_API_SERVER_K8S_PORT
      - name: BOOKING_API_SERVER_K8S_PORT
        key: BOOKING_API_SERVER_K8S_PORT
      - name: PAYMENT_API_SERVER_K8S_PORT
        key: PAYMENT_API_SERVER_K8S_PORT
      - name: FRONTEND_SENTRY_DSN
        key: FRONTEND_SENTRY_DSN
      - name: ASTROLOGICAL_API_URL
        key: ASTROLOGICAL_API_K8S_URL
      - name: PAYMENT_API_URL
        key: PAYMENT_API_K8S_URL
      - name: BOOKING_API_URL
        key: BOOKING_API_K8S_URL
      - name: STRIPE_PK
        key: STRIPE_PK
      - name: R2_BASE_URL
        key: R2_BASE_URL
    # Exact DopplerSecret sync list for this service (order matches the
    # original 03-doppler-secrets.yaml). It is NOT derived from `env`
    # above: the frontend syncs CORS_ORIGINS plus both the public and the
    # K8s-reachable API URLs, and the payment sync lists keys in a different
    # order than the container env. Keeping one explicit list means the
    # Deployment wiring and the sync list can never drift apart silently —
    # the placeholder Secrets and the validation step both use these keys.
    dopplerSync:
      - NODE_ENV
      - FRONTEND_SERVER_PORT
      - FRONTEND_SERVER_DNS
      - ASTROLOGY_API_SERVER_PORT
      - ASTROLOGY_API_SERVER_DNS
      - BOOKING_API_SERVER_PORT
      - BOOKING_API_SERVER_DNS
      - PAYMENT_API_SERVER_PORT
      - PAYMENT_API_SERVER_DNS
      - FRONTEND_SERVER_K8S_PORT
      - ASTROLOGY_API_SERVER_K8S_PORT
      - BOOKING_API_SERVER_K8S_PORT
      - PAYMENT_API_SERVER_K8S_PORT
      - CORS_ORIGINS
      - ASTROLOGICAL_API_URL
      - PAYMENT_API_URL
      - BOOKING_API_URL
      - STRIPE_PK
      - R2_BASE_URL
      - FRONTEND_SENTRY_DSN
      # K8s-reachable endpoints behind the _API_URL references above (Doppler
      # resolves ${...} server-side at sync; keep both sides listed).
      - ASTROLOGICAL_API_K8S_URL
      - PAYMENT_API_K8S_URL
      - BOOKING_API_K8S_URL
  - name: astrology-api
