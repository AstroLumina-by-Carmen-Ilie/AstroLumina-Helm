# Development environment. Single Deployment per service (no blue/green),
# NodePort services straight to the LAN, no Traefik, permissive NetworkPolicy.
environment: development
namespace: astrolumina-dev
# Values file name (used by NOTES.txt upgrade hints).
valuesFile: values-dev.yaml
# Phase out the placeholder Secrets after the Doppler sync is verified:
# helm upgrade ... --set placeholderSecretsEnabled=false
placeholderSecretsEnabled: true

blueGreen:
  enabled: false
  colors:
    - blue
    - green
  liveColor: blue # unused on dev (no *-live Services), kept for schema parity
  nodeNames: {} # no node affinity on dev

replicas: 1

# Probe delays only; period/timeout/threshold are constant across all envs
# (liveness 30s/10s/3, readiness 15s/5s/2) and live in the template.
probes:
  frontend:
    livenessDelay: 15
    readinessDelay: 10
  api:
    livenessDelay: 15
    readinessDelay: 10

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  # Extra memory metric, service name -> utilization. Only dev scopes the
  # frontend on memory; staging/production use CPU only.
  memoryUtilization:
    frontend: 75

exposure: NodePort # dev reaches pods via NodePorts, no IngressRoutes

traefik:
  enabled: false
  host: ""
  dashboardHost: ""
  tls: false
  redirectHttp: false
  dashboardAuth: false
  certResolver: letsencrypt
  tlsDomain: ""

networkPolicy:
  strict: false # permissive dev policy (see template)

doppler:
  config: dev
  tokenSecret: doppler-token-dev
  namePrefix: astrolumina-dev

# Placeholder Secret values (02-secrets.yaml equivalent). Fake but
# format-plausible so pods boot until Doppler syncs real values. Real
# credentials are NEVER committed — they are injected by the Doppler
# operator at deploy time (see doppler-secrets.yaml template + NOTES.txt).
