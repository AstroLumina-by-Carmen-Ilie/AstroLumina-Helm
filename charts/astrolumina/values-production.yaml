# Production environment. Same shape as staging plus: 3 replicas, slower
# probes, HTTPS via the letsencrypt certResolver, HTTP->HTTPS redirect and
# basic-auth on the Traefik dashboard. Live Stripe keys (placeholders here).
environment: production
namespace: astrolumina-prod
# Values file name (used by NOTES.txt upgrade hints).
valuesFile: values-production.yaml
# Phase out the placeholder Secrets after the Doppler sync is verified:
# helm upgrade ... --set placeholderSecretsEnabled=false
placeholderSecretsEnabled: true

blueGreen:
  enabled: true
  colors:
    - blue
    - green
  liveColor: blue # LIVE: flip to green to switch traffic
  nodeNames:
    blue: rke2-worker-daniel-pirvu-01
    green: rke2-worker-daniel-pirvu-02

replicas: 3

probes:
  frontend:
    livenessDelay: 10
    readinessDelay: 5
  api:
    livenessDelay: 40
    readinessDelay: 30

hpa:
  minReplicas: 3
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: {}

exposure: live # traffic flows through the *-live ClusterIP Services

traefik:
  enabled: true
  host: production.k8s.astrolumina.ro
  dashboardHost: dashboard.k8s.astrolumina.ro
  tls: true
  redirectHttp: true
  dashboardAuth: true
  certResolver: letsencrypt
  tlsDomain: production.k8s.astrolumina.ro

networkPolicy:
  strict: true

doppler:
  config: prd
  tokenSecret: doppler-token-prd
  namePrefix: astrolumina-production

# Placeholder Secret values (02-secrets.yaml equivalent). Fake but
# format-plausible so pods boot until Doppler syncs real values. Real
# credentials are NEVER committed — they are injected by the Doppler
# operator at deploy time (see doppler-secrets.yaml template + NOTES.txt).
