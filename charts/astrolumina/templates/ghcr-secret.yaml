{{/* GHCR pull-secret placeholder. The real dockerconfigjson is created
imperatively from Doppler-sourced credentials after each cluster rebuild
(see NOTES.txt) — a pull secret cannot be synced by the Doppler operator. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.image.pullSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: {{ .Values.environment }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"REPLACE_WITH_GITHUB_USER","password":"REPLACE_WITH_GITHUB_TOKEN","email":"admin@astrolumina.com","auth":"UkVQTEFDRV9XSVRIX0dJVEhVQl9VU0VSOlJFUExBQ0VfV0lUSF9HSVRIVUJfVE9LRU4="}}}'
