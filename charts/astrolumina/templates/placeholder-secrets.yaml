{{/* Placeholder Secrets — first-boot values until Doppler syncs. Fake but
format-plausible values from values-<env>.yaml so pods boot until Doppler
syncs the real values. Every synced key must exist here: a missing key
means CreateContainerConfigError, not a running pod. */}}
{{- $root := . }}
{{- if .Values.placeholderSecretsEnabled }}
{{- range $svc := .Values.services }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astrolumina.secretName" (list $svc) }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: astrolumina
    app.kubernetes.io/component: {{ $svc.component }}
    environment: {{ $root.Values.environment }}
type: Opaque
stringData:
{{- $ph := index $root.Values.placeholderSecrets $svc.name }}
{{- range $k, $v := $ph }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
