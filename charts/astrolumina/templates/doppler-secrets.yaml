{{/* DopplerSecret sync wiring (03-doppler-secrets.yaml equivalent). The sync
key lists come from the same service catalog as the Deployment env wiring,
so the two can never drift apart. The token Secret itself is NOT in git —
create it imperatively once per cluster rebuild (see NOTES.txt). */}}
{{- $root := . }}
{{- range $svc := .Values.services }}
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: {{ $root.Values.doppler.namePrefix }}-{{ $svc.name }}
  namespace: doppler-operator-system
  labels:
    app.kubernetes.io/part-of: astrolumina
    environment: {{ $root.Values.environment }}
spec:
  project: astrolumina
  config: {{ $root.Values.doppler.config }}
  tokenSecret:
    name: {{ $root.Values.doppler.tokenSecret }}
    namespace: doppler-operator-system
  managedSecret:
    name: {{ include "astrolumina.secretName" (list $svc) }}
    namespace: {{ $root.Values.namespace }}
  secrets:
{{- range $key := $svc.dopplerSync }}
    - {{ $key }}
{{- end }}
{{- end }}
